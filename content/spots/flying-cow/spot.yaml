    - text: 導覽分出乳牛、黑山羊、綿羊、兔與蝴蝶等生態區。
      ref: map
  activities:
    - 選一種動物觀察牠吃東西時嘴巴的動作。
agentTips:
  - 自然步道施工期間依圍門及現場指示安排路線。
  - 公車下車後仍有約2公里路程，帶幼兒可先評估轉乘計程車。
nearby: []
transport:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 地址
      value: 苗栗縣通霄鎮南和里166號。
      ref: traffic
    - status: ok
      label: 臺鐵轉乘
      value: 通霄站可轉計程車，園方估約15分鐘；離園可請服務中心協助叫車。
      ref: traffic
    - status: ok
      label: 公車接步行
      value: 通霄車站外和平路搭往福興或大坑尾方向班車，崎下站下車後尚須步行約2公里；班次先向苗栗客運確認。
      ref: traffic
    - status: ok
      label: 停車場地維護費
      value: 小客車每部50元，20人座以上大客車每部100元。
      ref: tickets
hoursAndFees:
  checkedAt: 2026-10-16
  facts:
    - status: conflict
      label: 開放時間
      claims:
        - value: 園方門票頁列08:00–19:00。
          ref: tickets
        - value: 食農場域頁列每日07:00–19:00。
          ref: moa
        - value: 農業易遊網列每日07:00–22:00。
          ref: ezgo
      contact: 三處時段不同，出發前洽飛牛牧場037-782999確認一日遊入園時間。
    - status: ok
      label: 一日遊門票
      value: 全票280元；40人以上團體每人260元。國小學童220元；3歲至幼稚園及65歲以上160元。
      ref: tickets
    - status: ok
      label: 幼兒免票條件
      value: 園方同頁列「3歲以下」免費，與幼童票的3歲起算文字重疊；滿3歲請先向園方確認。
      ref: tickets
    - status: ok
      label: 身心障礙優惠
      value: 出示本人手冊，本人與一位陪同者各140元；門票可換一杯乳製品。
      ref: tickets
