authorNotes: []
facilities:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 服務台
      value: 提供輪椅、嬰兒推車與臨時寄物；哺集乳室位於大廳二樓及世界水域館服務台後方。
      ref: service
    - status: ok
      label: 近期施工
      value: 臺灣水域館兒童陽台遊憩設施公告於2026年10月13日至30日整修封閉。
      ref: children
    - status: ok
      label: 預告施工
      value: 鯨魚廣場預告於2026年11月1日至20日檢查維護並封閉，並非本次查證日已封閉。
      ref: whale
    - status: ok
      label: 參觀規範
      value: 展場禁用閃光燈、拍打玻璃及餵魚；極地企鵝區溫度較低，館方提醒攜帶禦寒衣物。
      ref: service
withKids:
  checkedAt: 2026-10-16
  facts:
    - text: 臺灣水域館以從高山溪流走向海洋的順序呈現水域環境。
      ref: access
    - text: 珊瑚王國館有珊瑚礁、海底隧道與花園鰻主題；世界水域館包含巨藻森林及企鵝展示。
      ref: access
  activities:
    - 挑選溪流、珊瑚礁與極地各一個展區，比較水中景觀與動物移動方式。
agentTips:
  - 先圈選孩子想看的兩個展館，將休息時間排在轉館之前。
nearby: []
transport:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 鐵路與高鐵轉乘
      value: 可由枋寮站搭往墾丁客運，至南保力站後轉往埔墘路口站搭墾丁街車入館；高鐵左營站可接墾丁快線後轉車。班次與轉乘步行位置出發前核對。
      ref: transport
    - status: ok
      label: 停車收費
      value: 館方服務頁列小客車50元、機車20元、大客車100元；現場公告若調整須再確認。
      ref: service
hoursAndFees:
  checkedAt: 2026-10-16
  facts:
    - status: conflict
      label: 營業時間與休館日
      claims:
        - value: 中文服務頁及經營團隊時間圖列一般09:00–17:00、週二休館；國定假日、連假及寒暑假例外，最後售票為閉館前一小時。
          ref: service
        - value: 英文頁仍列一般月份09:00–17:30，未列週二休館；7、8月及春節另有延長時段。
          ref: english
      contact: 官方語言版本不同，請先洽08-882-5678核對預定日期；中文首頁與經營團隊目前同樣提示週二休館。
    - status: ok
      label: 門票
      value: 全票450元、優待票250元、65歲以上博愛票225元；20人以上同機關團體票350元，宜提前三天預約。優待與免費資格均需證件。
      ref: service
    - status: conflict
      label: 幼兒免費資格文字
      claims:
        - value: 館方中文服務頁以身高115公分以下「及」未滿6歲表述，並須付費家長或師長同行。
          ref: service
        - value: 經營團隊票價圖以身高115公分以下「或」未滿6歲表述，並須付費家長或師長同行。
          ref: operator
      contact: 年齡與身高若只符合一項，請先向08-882-5678確認並攜證件；不自行推定適用資格。
    - status: ok
      label: 身障免費
      value: 持身心障礙證明者及一位必要陪同者可免費，購票時備證件。
      ref: service
familyChecklist:
  checkedAt: 2026-10-16
  stroller:
