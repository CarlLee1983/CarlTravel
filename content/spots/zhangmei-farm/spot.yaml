facilities:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 手作體驗
      value: 規劃蔥油餅、芋圓、愛玉或麻糬等農產手作，實際項目依當日安排。
      ref: activities
withKids:
  checkedAt: 2026-10-16
  facts:
    - text: 農場介紹水豚、梅花鹿及瓦萊黑鼻羊等動物互動內容。
      ref: activities
    - text: 手作課程使用三星在地農產品，從材料加工成可食用成品。
      ref: activities
  activities:
    - 依工作人員指示站在觀察位置，比較鹿與羊的耳朵和毛色。
    - 做手作前先辨認材料，完成後說說外形有什麼改變。
agentTips:
  - 先選單純動物區或含DIY的套票，確認孩子的收費資格與當天手作內容。
  - 餵食方式、可用草料與動物休息安排依工作人員說明，不自行帶食物接近動物。
nearby: []
transport:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 公車
      value: 園方列1794至富興站後步行約3分鐘；另可搭1792至田心仔，步行約1.2公里。班次與步行環境出發前另確認。
      ref: contact
    - status: ok
      label: 導航與洽詢
      value: 以行健溪一路二段161號為目的地，避免導向其他園區；活動及交通可洽0935-514-462。
      ref: home
hoursAndFees:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 營業時間
      value: 官網列09:00–17:00，出發前可確認當日開放與課程安排。
      ref: contact
    - status: ok
      label: 動物區入園票
      value: 成人250元、敬老200元、兒童50元；兒童及優惠資格購票前向園方確認。
      ref: home
    - status: ok
      label: DIY套票
      value: 成人350元、優待300元、兒童50元；包含入園及當日安排的一項手作，內容與適用資格先確認。
      ref: activities
