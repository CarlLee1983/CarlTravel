  facts:
    - status: ok
      label: 高鐵轉乘
      value: 高鐵臺中站出口6第13月台搭159號至植物園（西屯路）站；也可搭捷運至市政府站轉公車至科博館（專用道）。
      ref: traffic
    - status: ok
      label: 停車與電梯
      value: 館方提供博館路、植物園與西屯路三處停車場；後兩處設電梯。
      ref: traffic
    - status: ok
      label: 持票日間停車
      value: 08:00–19:00，參觀觀眾憑有效票根或恐龍卡，小車15元／半小時、大車30元／半小時，上限180元；QR票須先入館掃碼驗票並於出車前折抵。
      ref: traffic
hoursAndFees:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 開館與休館
      value: 週二至週日09:00–17:00，售票至16:30；週一、除夕及初一休館，週一逢國定假日或補假照常開館。
      ref: hours
    - status: ok
      label: 展示場票價
      value: 一般120元、6歲以上未滿12歲60元、12歲以上學生90元，未滿6歲免費；展示場含生命科學廳、人類文化廳與地球環境廳。
      ref: ticket
    - status: ok
      label: 分區購票
      value: 植物園溫室與科學中心一般票各20元；太空劇場100元、必可飛劇場70元，須另依票種購票。
      ref: ticket
    - status: ok
      label: 2026限定優惠
      value: 2026年每週五14:00–17:00展示場免費，其他區域仍按各自票制。
      ref: ticket
