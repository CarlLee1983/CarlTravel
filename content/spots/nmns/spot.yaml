      ref: life
withKids:
  checkedAt: 2026-10-16
  facts:
    - text: 恐龍展示包含會動會叫的機械暴龍，以及竊蛋龍化石、頭骨與骨架等標本。
      ref: life
  activities:
    - 找出機械模型與化石標本，看看哪些部位有保存骨骼證據。
    - 比較不同恐龍的頭骨與四肢形狀，把觀察到的差異畫下來。
agentTips:
  - 孩子若對聲響敏感，可先說明機械恐龍會動、會叫，再決定是否靠近。
  - 先選生命科學廳的少數主題；劇場及植物園依體力另作安排。
