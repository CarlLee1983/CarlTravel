transport:
  checkedAt: 2026-10-15
  facts:
    - status: ok
      label: 大眾運輸
      value: 從新營車站轉乘大台南公車棕一線，在頑皮世界站下車。
      ref: wanpi-visit
    - status: ok
      label: 停車
      value: 機車免費；汽車每次100元，30分鐘內離場免費。
      ref: wanpi-visit
hoursAndFees:
  checkedAt: 2026-10-15
  facts:
    - status: ok
      label: 開放時間
      value: 全年無休，09:00–17:00；最後入園16:00。
      ref: wanpi-visit
    - status: conflict
      label: 全票價格
      claims:
        - value: 園方列原價700元，平日優惠499元、假日優惠550元。
          ref: wanpi-visit
        - value: 台南旅遊網列全票480元。
          ref: tainan-tourism
      contact: 票價以園方最新公告為準；購票前可致電06-7810000確認。
    - status: ok
      label: 學童票
      value: 6至未滿12歲平日380元、假日430元。
      ref: wanpi-visit
    - status: conflict
      label: 幼童票
      claims:
        - value: 園方列3至未滿6歲290元。
          ref: wanpi-visit
        - value: 台南旅遊網列3至6歲280元。
          ref: tainan-tourism
      contact: 以園方最新公告為準；購票前可致電06-7810000確認。
    - status: ok
      label: 未滿3歲
      value: 憑證件免費；每位成人最多陪同3名未滿3歲幼兒，特殊需求幼兒則需一對一陪同。
      ref: wanpi-visit
