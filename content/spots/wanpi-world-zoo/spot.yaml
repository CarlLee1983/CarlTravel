facilities:
  checkedAt: 2026-10-15
  facts:
    - status: ok
      label: 親子設施
      value: 親子廁所位於企鵝區前方，地圖編號71；同編號設有集哺乳室與飲水機。
      ref: wanpi-home
    - status: ok
      label: 輪椅借用
      value: 可向入口工作人員免費借用輪椅。
      ref: wanpi-home
    - status: ok
      label: 無障礙設施
      value: 台南旅遊網列有無障礙停車位、廁所及建物坡道；未說明全園動線。
      ref: tainan-tourism
    - status: ok
      label: 雨天活動
      value: 大雨時室外保育員解說可能取消；下雨時遊園列車可能停駛，以現場公告為準。
      ref: wanpi-visit
withKids:
  checkedAt: 2026-10-15
  facts:
    - text: 園方介紹南美水豚、黑腳企鵝及金剛鸚鵡等動物展示區。
      ref: wanpi-home
    - text: 園方提供保育員解說活動，每週時段另行更新；大雨時室外場次可能取消。
      ref: wanpi-visit
  activities:
    - 在黑腳企鵝區觀察每隻企鵝胸腹斑點的差異。
    - 聽解說時，請孩子挑一種動物記下牠的外形特徵。
