transport:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 機場捷運
      value: 園方列A20興南站下車後步行約16分鐘可到牧場，實際路況依現場為準。
      ref: access
    - status: ok
      label: 開車
      value: 國道1號中壢新屋交流道下，經民族路、環西路轉民權路，再依三芝路招牌進入。
      ref: access
    - status: ok
      label: 停車
      value: 園內備有停車場，收費規則需另向牧場確認。
      ref: tourism
hoursAndFees:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 牧場時間
      value: 園方列週一至週日09:00–17:00；餐廳有不同營業時段，週三休息，不能當作牧場休園日。
      ref: access
    - status: ok
      label: 入場門票
      value: 每人100元，官網免票文字為幼稚園以下免費；資格細節可先洽03-426-6987。
      ref: farm
    - status: ok
      label: 外食與餵食規定
      value: 攜帶外食每人加收100元清潔費；餵食動物只能使用牧場提供的飼料或草。
      ref: farm
