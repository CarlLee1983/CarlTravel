    - status: ok
      label: 育嬰與廁所
      value: 食農平臺列有育嬰室、廁所與會議空間，未列育嬰室內部設備。
      ref: agriculture
    - status: ok
      label: 無障礙設施
      value: 食農平臺列有無障礙廁所及步道；可通行範圍與現況可先洽詢。
      ref: agriculture
withKids:
  checkedAt: 2026-10-16
  facts:
    - text: 農場除山羊外，也介紹兔子、羊駝及孔雀等動物，並提供草與飼料供依規則餵食。
      ref: farm
    - text: 牧場以羊乳及羊肉等畜產為食農教育主題，規劃導覽與體驗。
      ref: agriculture
  activities:
    - 看山羊吃草時，留意牠嘴巴與下顎的動作，向解說員提問。
    - 比較羊駝和山羊耳朵、毛色與身形的差異。
agentTips:
  - 動物餵食與DIY內容先向牧場確認，依工作人員指示操作。
  - 下雨時先問步道路況與可用教室，不只依照有室內空間就認定全部行程照常。
