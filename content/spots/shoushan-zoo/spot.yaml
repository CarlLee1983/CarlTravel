facilities:
  checkedAt: 2026-10-15
  facts:
    - status: ok
      label: 推車及輪椅
      value: 入口服務中心提供娃娃車和輪椅租用。
      ref: service
    - status: ok
      label: 哺乳室
      value: 服務中心旁設哺乳室，備有尿布台、熱水和母乳存放冰箱。
      ref: service
    - status: ok
      label: 公廁
      value: 園方列出園內6座公廁的位置。
      ref: service
    - status: ok
      label: 親水廣場
      value: 戶外親水廣場每週四上午暫停開放以進行清洗維護。
      ref: service
withKids:
  checkedAt: 2026-10-15
  facts:
    - text: 兒童牧場的動物餵食體驗排定週二至週日10:00–11:00、14:00–15:00，雨天暫停且牧草數量有限。
      ref: notice
    - text: 園區有戶外親水廣場，週四上午因清洗維護暫停開放。
      ref: service
  activities:
    - 參觀前查看園方動物展示及餵食公告，和孩子觀察動物的外形與活動方式。
agentTips: []
nearby: []
transport:
  checkedAt: 2026-10-15
  facts:
    - status: ok
      label: 大眾運輸
      value: 可從高雄火車站、捷運鹽埕埔站或輕軌文武聖殿站轉乘56號公車到動物園。
      ref: visit
    - status: ok
      label: 停車場
      value: 停車場距入口約300公尺；園區入口禁止車輛臨停。
      ref: visit
    - status: conflict
      label: 小客車平日停車費
      claims:
        - value: 每次40元
          ref: visit
        - value: 每次30元
          ref: tourism
      contact: 出發前向園方確認當日收費，電話07-5215187。
hoursAndFees:
  checkedAt: 2026-10-15
  facts:
    - status: ok
      label: 開放時間
      value: 週二至週日09:00–17:00，16:30停止入園；週一及除夕休園，週一逢國定假日照常開園。
      ref: visit
    - status: ok
      label: 門票
      value: 全票40元；6歲以上未滿18歲半票20元；未滿6歲及高雄市國小學童免票，優惠資格須依園方規定出示證件。
      ref: visit
    - status: ok
      label: 購票
      value: 參觀免預約，可於現場售票亭或自動售票機購票。
      ref: visit
familyChecklist:
  checkedAt: 2026-10-15
  stroller:
    status: yes
    ref: service
    note: 入口服務中心可租娃娃車；未查得全園推車動線說明。
  nursingRoom:
    status: yes
    ref: service
    note: 位於服務中心旁，設尿布台。
  familyToilet:
    status: unknown
  rainyDay:
    status: unknown
  accessibility:
    status: yes
    ref: access
    note: 園方介紹空中長廊設平緩坡道及無障礙電梯；其他動線須另向園方確認。
  notes: 親子廁所與雨天參觀條件未查得完整官方說明；兒童牧場餵食在雨天暫停。
