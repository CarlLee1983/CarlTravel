facilities:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 沙林館
      value: 二樓設生態書籍閱覽空間、動物標本區與室內圓形劇場。
      ref: hall
    - status: ok
      label: 戶外參訪規範
      value: 收容園區以戶外環境為主，較無遮陰；禁止拍照攝影、撐傘、攜帶飲料食物及大聲喧嘩，可帶裝白開水的水壺。
      ref: visit
withKids:
  checkedAt: 2026-10-16
  facts:
    - text: 沙林館透過動物標本、生態書籍及影像空間傳遞生命教育。
      ref: hall
  activities:
    - 從標本或書籍挑一種動物，討論牠在野外需要哪些生活條件。
    - 完成導覽後，記下照養員為動物安排的環境與照護工作。
agentTips:
  - 先確認人數與預約，依工作人員安排觀察，不自行進入照養區。
nearby: []
transport:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 參訪入口與報到
      value: 由屏科大正門進入校園；收容園區預約者須提前10分鐘至沙林生命教育館櫃台報到購票。
      ref: visit
    - status: ok
      label: 停車
      value: 使用中心專用停車場，請勿開車或騎車到收容中心或沙林館門口。
      ref: visit
hoursAndFees:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 沙林生命教育館
      value: 08:30–17:00，週一休館，免費；此開放範圍不等於可自由走入收容園區。
      ref: visit
    - status: ok
      label: 收容園區導覽
      value: 週一、四休園，開放日10:00及15:00兩場，每場約1.5小時；一般100元、屏科大教職員生憑證50元。
      ref: visit
    - status: ok
      label: 預約與年齡限制
      value: 園區入內皆須導覽陪同，謝絕未滿5歲兒童；5至14人須一週前實名預約，15人以上須三週前申請，不接受當日臨時預約。
      ref: visit
    - status: ok
      label: 未達成團人數
      value: 最低5人成團，不足5人可先詢問合併參訪名額；當日不足預約人數仍依預約人數計費。
      ref: visit
    - status: ok
      label: 預約專線
      value: 2026年9月更新為08-7740388，或08-7703202分機5136、5123、5121；15人以上團體預約窗口請一併確認。
      ref: phone
