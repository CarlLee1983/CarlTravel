authorNotes: []
withKids:
  checkedAt: 2026-10-15
  facts:
    - text: 穿山甲館以亞馬遜雨林為展示主題，將水域與樹冠等不同高度的環境放在同一館內。
      ref: pangolin
  activities:
    - 選一隻看得到的動物，觀察牠待在水裡、地面還是樹上，再一起找解說牌。
agentTips:
  - 先選幾個想看的館區，再確認輪休日；保留休息時間，不必一次走完。
  - 出發前確認天候與臨時停展公告，雨天另備可縮短的行程。
nearby: []
transport:
  checkedAt: 2026-10-15
  facts:
    - status: ok
      label: 捷運
      value: 文湖線搭至動物園站。
      ref: transport
    - status: ok
      label: 開車停車
      value: 可查詢動物園站地下停車場、河川地停車場或木柵機廠停車場的剩餘車位。
      ref: transport
hoursAndFees:
  checkedAt: 2026-10-15
  facts:
    - status: ok
      label: 日間開放
      value: 09:00–17:00；16:00 後不再入園，動物展示至 16:30。
      ref: hours
    - status: ok
      label: 休園與輪休
      value: 農曆除夕及年度休園期間不開放；室內館另有週一輪休，連假可能順延，出發前查官網當日安排。
      ref: hours
    - status: ok
      label: 入園票價
      value: 普通票 100 元、臺北市民票 60 元、優待票 50 元。
      ref: prices
    - status: ok
      label: 兒童票
      value: 0–5 歲免票，6–11 歲適用優待票，皆不限國籍；持臺北市國小數位學生證者免票，優惠身分需備證明文件。
      ref: tickets
