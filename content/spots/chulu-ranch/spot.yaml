hoursAndFees:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 營業與體驗
      value: 08:00–17:00；各項體驗至16:30，門票不抵消費。
      ref: tickets
    - status: ok
      label: 全票與兒童優惠
      value: 平日全票100元、兒童優惠80元；國定假日、例假日及7–8月分別為200與180元。票價圖兒童資格寫「7歲以上未滿12歲(含)」，12歲是否適用語意不明，請洽089-571002確認。
      ref: tickets
    - status: ok
      label: 長者、縣民與免票
      value: 65歲以上、身障陪同一位及臺東縣民票平日50元／假日100元；6歲以下與身障本人依證件免票。
      ref: tickets
    - status: conflict
      label: 寒假計價口徑
      claims:
        - value: 園方票價圖將7–8月列入假日票適用欄。
          ref: tickets
        - value: 鄉公所文字將寒暑假都列入假日票適用期間。
          ref: town
      contact: 寒假適用價格未一致，購票前洽089-571002確認。
