transport:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 自行開車
      value: 中文交通指南建議由國道三號高原交流道下，依沿途指標前往園區。
      ref: traffic
    - status: ok
      label: 停車
      value: 園區提供小客車與遊覽車停車空間；汽車每次200元、機車每次100元，離場前繳費。
      ref: traffic
    - status: ok
      label: 大眾運輸
      value: 可由中壢搭亞通客運5653線，或搭5350線前往；高鐵新竹站可轉觀光2號，該線限週六、週日及國定假日行駛，班次出發前重查。
      ref: traffic
hoursAndFees:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 園區時間（2026年10月）
      value: 月份時刻表列平日09:30–17:00，週五延長至19:30；假日09:00–19:30，17:00後只開放美國大西部。其他月份另查官網。
      ref: hours
    - status: ok
      label: 動物區時間（2026年10月）
      value: 非洲部落平日09:30–16:00、假日09:00–16:30；蒸氣火車與猴園平日09:45起、猛獸巴士平日10:00起，假日均09:30起，結束時間同為平日16:00、假日16:30。仍可能依天候與保養調整。
      ref: hours
    - status: ok
      label: 主題樂園牌價
      value: 成人票1400元、學生票1200元、學童票1000元、幼童票800元、博愛票700元。票種另有年齡、身高與證件條件，購票前核對官方表格；水樂園及雙園票另計。
      ref: tickets
    - status: ok
      label: 幼兒免票與額外付費
      value: 有家長陪同的未滿3歲或身高100公分以下幼兒可免票，幼兒園團體不適用。一般門票涵蓋四大園區與動物園，特殊體驗、動物餵食及部分遊戲需另外付費。
      ref: tickets
