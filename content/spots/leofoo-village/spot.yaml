facilities:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 嬰兒車與輪椅
      value: 售票口右側遊客服務中心提供租借；嬰兒車不能平躺，官方限制為6至48個月、身高100公分以下及體重15公斤以下。
      ref: services
    - status: ok
      label: 動物展示區規範
      value: 動物展示區公告禁止餵食；另購體驗須依園方當次規範參加。
      ref: animals
    - status: ok
      label: 設施停用公告
      value: 觀光署2026年9月公告指出蘇丹王大冒險與飛毯已停止使用。園內各設施開放情況另依最新維護及現場公告。
      ref: inspection
withKids:
  checkedAt: 2026-10-16
  facts:
    - text: 非洲部落的動物展示包含猴類、羊駝、狐獴與臺灣黑熊。
      ref: animals
    - text: 蒸氣火車行經草食動物區，官方列舉河馬、野牛與白犀牛；猛獸巴士則行經猛獸區。
      ref: animals
  activities:
    - 乘車時選兩種動物，比較牠們進食與移動的方式。
    - 在觀察位置找動物的耳朵、尾巴與身體花紋，描述看到的差異。
agentTips:
  - 把動物區排在較早時段，離開前再核對其他主題區的個別關閉時間。
  - 先量好孩子身高，再查欲搭乘設施的限制，避免只按票種判斷能否搭乘。
