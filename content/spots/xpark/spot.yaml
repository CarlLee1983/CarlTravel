facilities:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 借用與寄物
      value: 館內提供免費嬰兒車、輪椅借用，向服務台洽詢；沒有置物櫃或行李託放服務。
      ref: qa
    - status: ok
      label: 攝影規則
      value: 館內不得開閃光燈，也不能使用自拍棒或腳架。
      ref: qa
    - status: ok
      label: 互動展演調整
      value: 2026年10月5日防疫通知表示「與眾同樂」的鸚鵡與老鷹互動展演暫停，海獅及其他生物仍可見面；實際場次依當日公告。
      ref: prevention
withKids:
  checkedAt: 2026-10-16
  facts:
    - text: 福爾摩沙展區以臺灣近海生態為主題，展示魚群與魟魚。
      ref: floor
    - text: 官方生物介紹指出粗尾魟屬底棲性，銀鱗鯧有群游習性。
      ref: floor
  activities:
    - 留意魚群在水槽中的高度，再比較魟魚靠近底部移動的姿態。
agentTips:
  - 進館前先借推車或詢問電梯位置，減少在樓層之間折返。
  - 先挑一個水槽安靜停留，讓孩子描述游動方向，再繼續其他展區。
