transport:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 高鐵與機捷
      value: 可至高鐵桃園站或機捷A18，再經華泰名品城步行至館。官方步行路線含樓梯，推車或輪椅請另確認電梯動線。
      ref: traffic
    - status: ok
      label: 置地廣場停車
      value: 與影城及飯店共用停車場，每半小時30元；每車可用一張成人票折抵兩小時，不能累計。
      ref: traffic
    - status: conflict
      label: 華泰停車折抵
      claims:
        - value: Xpark交通頁及QA列一張成人票可折抵兩小時。
          ref: traffic
        - value: 桃園觀光網列華泰停車場成人票折抵一小時。
          ref: tourism
      contact: 兩處折抵說明不同，停車前請向場館或停車場確認；Xpark電話03-287-5000。
hoursAndFees:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 一般營業時間
      value: 週日至週五及收假日10:00–18:00；週六及國定假日10:00–20:00。閉館前一小時停止入場，特殊日期另查官網。
      ref: qa
    - status: ok
      label: 現場票價
      value: 成人600元；12歲以上持有效學生證者430元；4歲至未滿12歲兒童270元。博愛票270元，適用身障者及一名陪同、孕婦與65歲以上長者，購票入場均備證件。
      ref: ticket
    - status: ok
      label: 免票與加價
      value: 未滿4歲且有家長陪同幼兒可免費入場；部分展區及活動另付費。票券依指定日期和場次使用，部分生物區域不全天開放。
      ref: ticket
