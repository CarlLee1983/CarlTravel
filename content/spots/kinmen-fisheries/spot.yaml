hoursAndFees:
  checkedAt: 2026-10-16
  facts:
    - status: conflict
      label: 展示開放時段
      claims:
        - value: 館方參訪FAQ列週一至五08:00–17:30，部分景點例假日亦開放。
          ref: faq
        - value: 養殖漁業課介紹列水族展示館每日09:00–15:00、全年無休。
          ref: department
      contact: 不同頁面範圍與時段不一致；特別是假日參觀水族館，請先致電082-326408確認可入區域與當日時段。
    - status: ok
      label: 影片與專人解說
      value: 館方FAQ列3人即可申請影片及專人導覽，可事先預約。
      ref: faq
    - status: ok
      label: 申請與導覽時段
      value: 112年8月25日修訂申請表要求至少3天前提出；參訪週一至五08:00–12:00、13:30–17:30，國定例假日無預約導覽，可自行參觀。經排定後館方仍可能因重要活動通知取消或延期。
      ref: apply
    - status: ok
      label: 一般展館門票
      value: 官方無障礙旅遊手冊列水試所免費參觀。
      ref: accessibleGuide
    - status: ok
      label: 鱟生態之旅另約另計
      value: 官方旅遊網2026年5月更新課程：每人350元，10人成行、上限20人，約2.5小時；週一至日可來電提前預約，須配合潮汐。這是專案課程，與一般展館參觀分開確認。
      ref: tour
