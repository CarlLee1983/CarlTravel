facilities:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 展示與參訪項目
      value: 申請表列鱟影片、鱟生態文化館導覽，以及珍奇異色水族館、養殖區與旅客服務中心參觀；活動內容依申請與館方排定。
      ref: apply
    - status: ok
      label: 潮間帶觀察規範
      value: 鱟生態之旅以不觸碰、不干擾為原則；官方說明金門全縣海域為三棘鱟禁捕區域。
      ref: tour
withKids:
  checkedAt: 2026-10-16
  facts:
    - text: 館方提供鱟生態文化館、影片及水族展示等認識海洋生物的參訪項目。
      ref: faq
  activities:
    - 在館內觀察鱟的外形，畫下背甲、尾部與眼睛位置；是否參與戶外課程再依潮汐及孩子體力安排。
agentTips:
  - 先電話確認想看的展館與日期，再預約導覽；研究與養殖工作區請依館方安排參訪。
