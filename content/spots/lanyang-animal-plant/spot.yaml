    - status: ok
      label: 參觀空間
      value: 園區有戶外動物區及室內溫室。
      ref: park
    - status: ok
      label: 服務設施
      value: 宜蘭勁好玩列有公廁、服務台及導覽解說，並介紹設有空調的休憩餐飲空間。
      ref: yilan
withKids:
  checkedAt: 2026-10-16
  facts:
    - text: 園方介紹有水豚、袋鼠、羊駝和狐獴等動物，並提供生態解說及自然手作活動。
      ref: park
    - text: 溫室可見鹿角蕨與其他觀葉植物。
      ref: yilan
  activities:
    - 先選一種動物，觀察牠休息和移動時的姿勢。
    - 找找鹿角蕨與其他植物的葉片外形有何差別。
agentTips:
  - 想看動物飛行展示或參加手作，先向園方確認當日場次和是否需要預約。
  - 餵食與接觸動物前先詢問工作人員，讓孩子先觀察再決定是否參與。
