transport:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 公車與開車
      value: 館方指引由馬公搭藍線外垵線至岐頭水族館站；開車沿203縣道往白沙，再轉澎9鄉道。公車停靠與班次出發前核對。
      ref: info
    - status: unpublished
      label: 現行停車收費
hoursAndFees:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 一般時間
      value: 官網列09:00–17:00；水試所資訊列16:30停止售票，另有冬季休館公告，出發前須核對日期。
      ref: access
    - status: ok
      label: 2026至2027冬季館休
      value: 官方首頁公告2026年11月至2027年2月每週二休館，連假例外；2026年12月7日至24日年度館休。11月28日僅12:30–17:00營業，2027年2月5日除夕休館、2月6日至11日正常營業。
      ref: home
    - status: ok
      label: 常態門票
      value: 全票300元；學生、軍警持證優待票210元；65歲以上與澎湖縣民愛心票150元；20人以上同機關團體240元，須提前三天預約。
      ref: info
    - status: ok
      label: 免費資格
      value: 白沙鄉居民持證、未達110公分兒童，以及持身障證明者與一位陪同可免費。
      ref: info
    - status: conflict
      label: 幼兒免費年齡邊界
      claims:
        - value: 館方參觀資訊列未滿6歲兒童免費。
          ref: info
        - value: 水試所資訊列6歲以下兒童免費。
          ref: access
      contact: 已滿6歲但尚未滿7歲的適用資格請洽06-993-3006，不自行將兩種文字視為相同。
    - status: ok
      label: 幼兒陪同
      value: 水試所規定免費入館的幼兒須由家長陪同，優惠資格須出示有效證件。
      ref: access
