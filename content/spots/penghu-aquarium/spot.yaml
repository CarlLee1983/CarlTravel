      ref: info
withKids:
  checkedAt: 2026-10-16
  facts:
    - text: 一樓有沿岸、礁岩及大洋展示，並以14公尺海底隧道提供水下觀察視角。
      ref: intro
    - text: 館方介紹的海馬可用尾巴勾住藻類；海龜則屬爬蟲類。
      ref: intro
  activities:
    - 觀察海馬尾巴與魚的尾鰭有何不同，再找牠停留的位置。
    - 穿過隧道時，留意頭頂與身旁生物的游動方向。
agentTips:
  - 北環行程先核對休館日，再決定上午或下午入館。
