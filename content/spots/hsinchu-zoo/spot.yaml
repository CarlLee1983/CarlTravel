      ref: zoo-home
hoursAndFees:
  checkedAt: 2026-10-15
  facts:
    - status: ok
      label: 開放時間
      value: 09:00–17:00，16:20停止售票及入園；每週一與除夕休園，連假週一另依公告開放。
      ref: zoo-hours
    - status: ok
      label: 門票
      value: 全票50元；6歲以上、未滿12歲兒童優待票25元；未滿6歲或設籍新竹市未滿12歲兒童免票，優惠請備證明文件。
      ref: zoo-price
