      label: 一般開放
      value: 館方系統列週二至週日09:00–17:00、週一休館；專案參訪可依活動行程調整。
      ref: station
    - status: ok
      label: 國定假日
      value: 大鵬灣官方旅遊頁另明列國定假日休館；連假出發前請向08-8611315確認。
      ref: tourism
    - status: ok
      label: 門票
      value: 館方介紹列驛站所有設施免費開放。
      ref: station
    - status: ok
      label: 導覽預約
      value: 預約導覽須滿10人，至少7日前完成申請，可電話或線上辦理；預約專線07-5517418轉805261。
      ref: station
