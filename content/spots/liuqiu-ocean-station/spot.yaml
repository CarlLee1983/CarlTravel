facilities:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 海龜主題教育
      value: 館舍由原安檢所改建，以海龜為主題，推廣海洋保育教育及海域遊憩安全，提供旅遊諮詢與驛站導覽。
      ref: tourism
    - status: ok
      label: 旅客服務
      value: 官方服務項目列飲水機、沖洗設備、置物櫃與無障礙廁所。
      ref: tourism
    - status: ok
      label: 參觀規範
      value: 須依會場動線維持秩序、保護展品，禁止危險活動與喧嘩奔跑；館內禁菸、檳榔及飲酒。
      ref: station
withKids:
  checkedAt: 2026-10-16
  facts:
    - text: 展館用海龜主題傳遞保護海洋生物與海洋環境的重要性，也提供海域遊憩安全教育。
      ref: tourism
  activities:
    - 請孩子從展覽找一種海龜面對的威脅，再提出一項這趟旅行能實行的海洋友善行動。
agentTips:
  - 有導覽需求先湊足人數並提早申請；一般小家庭可先致電確認當天自行參觀方式。
