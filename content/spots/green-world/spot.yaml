facilities:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 哺乳空間
      value: 導覽圖在美食天地附近標有哺乳室。
      ref: map
    - status: ok
      label: 無障礙設施
      value: 參山遊程列有1間無障礙廁所、2格無障礙車位及1處無障礙通道。
      ref: barrier-free
    - status: ok
      label: 地形
      value: 園內有階梯及較陡坡道，行走與推行輔具前宜先確認路線。
      ref: ticket
withKids:
  checkedAt: 2026-10-16
  facts:
    - text: 蝴蝶園介紹產卵、結蛹和羽化，並設有培育昆蟲的大自然教室。
      ref: butterfly
    - text: 鳥園以模擬鳥類棲地的開放式空間展示鳥類。
      ref: butterfly
    - text: 羊駝散步排在每日10:30、13:00及14:30，地點為綠野廣場，遇雨可能取消。
      ref: schedule
  activities:
    - 看蝴蝶時，找找成蟲和蛹在外形上的不同。
    - 在湖邊挑一隻水鳥，觀察牠游動與整理羽毛的動作。
agentTips:
  - 先選湖邊、蝴蝶園或鳥園其中一區，再依孩子體力決定是否繼續走。
  - 出發前確認動物活動是否調整，並向園方詢問推車避開階梯的走法。
nearby: []
transport:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 開車
      value: 由國道3號竹林交流道往竹東，接台3線往北埔，在79公里處轉入，續行約2公里抵達。
      ref: traffic
    - status: ok
      label: 公車與接駁
      value: 高鐵新竹站可轉台灣好行至綠世界站，下車後致電03-580-1000分機9聯繫入園接駁。
      ref: traffic
    - status: ok
      label: 停車
      value: 設有停車場。
      ref: tourism
hoursAndFees:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 開放與售票
      value: 開園08:30–17:30，例假日可能延長；售票於16:00結束。
      ref: ticket
    - status: ok
      label: 一般門票
      value: 全票480元；優惠票400元供持證國高中生、65歲以上長者、教師及符合資格的特約廠商員工購買。
      ref: ticket
    - status: ok
      label: 兒童門票
      value: 兒童票350元，列3至12歲或身高90公分以上兒童；未滿3歲持健保卡免票。身高免票邊界請洽售票處確認。
      ref: ticket
    - status: ok
      label: 愛心票
      value: 身心障礙手冊持有人與陪同1人可憑證購240元愛心票；票價以現場公告為準。
      ref: ticket
