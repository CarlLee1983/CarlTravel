withKids:
  checkedAt: 2026-10-16
  facts:
    - text: 農場有淡水濕地、草生地和淺山森林，池塘與溪流提供不同生物棲地。
      ref: ecology
    - text: 園方以濕地與森林維護為主，並安排自然導覽等環境教育活動。
      ref: operator
  activities:
    - 跟著導覽比較池邊和森林裡看到的葉片形狀。
    - 聽見蛙鳴時先停下來聽，請解說員說明聲音可能來自哪種棲地。
agentTips:
  - 先把孩子年齡、參加人數及預計日期告訴園方，再確認可預約的課程與報價。
  - 帶水瓶、長褲及防滑包鞋，是否參加涉水活動另與園方確認。
nearby: []
transport:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 開車路線
      value: 由台2線到石門，經區公所轉入北21鄉道；園方建議沿濱海公路前往，避免導航帶入較難行駛的金山或石門山路。
      ref: reserve
    - status: ok
      label: 抵達前確認
      value: 先完成預約，再向園方確認入園位置；聯絡電話02-2638-2745。
      ref: operator
hoursAndFees:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 參訪方式
      value: 採預約入園；團體活動10人以上成行，需於至少7天前安排，個別公開活動另依公告報名。
      ref: reserve
    - status: conflict
      label: 開園日
      claims:
        - value: 園方頁列09:00–18:00，週二、週三休息。
          ref: operator
        - value: 農業局頁列週三至週日09:00–18:00。
          ref: county
      contact: 休息日說法不同，請先致電02-2638-2745確認預約日期，勿直接到場。
    - status: unpublished
      label: 一般入園與客製課程現行費用
