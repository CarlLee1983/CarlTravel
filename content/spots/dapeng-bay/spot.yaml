authorNotes: []
facilities:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 中心服務
      value: 提供旅遊諮詢、展覽解說及團體影片預約服務。
      ref: center
    - status: ok
      label: 無障礙與哺乳空間
      value: 遊客中心有無障礙廁所、車位及輪椅借用；觀光署友善指引另標示哺集乳室及斜坡。
      ref: friendly
withKids:
  checkedAt: 2026-10-16
  facts:
    - text: 遊客中心可取得潮汐與灣區資訊，協助認識濕地觀察時機。
      ref: center
    - text: 大潭濕地兼具滯洪與水質處理功能，設有不同水深與植被的生態空間。
      ref: wetland
  activities:
    - 在中心先看地圖，指出遊客中心與大潭濕地的不同位置。
    - 到濕地時從步道觀察鳥的腳長與覓食位置，不進入水池。
agentTips:
  - 雨勢較大時先以室內展示為行程，是否前往濕地另看當天天候與通行公告。
  - 向遊客中心詢問當天濕地動線與潮汐，別把灣區地圖上的每個範圍都當成可步行進入的區域。
nearby: []
transport:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 遊客中心公車
      value: 高鐵左營站可轉台灣好行9127D或9127G至大鵬灣遊客中心站，下車再走約2分鐘；班次與預約另查路線公告。
      ref: traffic
    - status: ok
      label: 遊客中心停車
      value: 中心設有免費停車場，這項規則不代表灣區其他停車場也免費。
      ref: ticket
    - status: ok
      label: 濕地位置
      value: 大潭濕地公園在東港鎮大潭路5-5號，臨台17線；與遊客中心分處兩個位置，需另外安排移動。
      ref: wetland
hoursAndFees:
  checkedAt: 2026-10-16
  facts:
    - status: ok
      label: 遊客中心
      value: 每日09:00–17:00，免費入館。
      ref: ticket
    - status: ok
      label: 大潭濕地開放
      value: 官方列每日開放；參觀以現場可通行步道為準。
      ref: wetland
    - status: unpublished
      label: 大潭濕地門票與停車費用
familyChecklist:
  checkedAt: 2026-10-16
  stroller:
    status: unknown
  nursingRoom:
    status: yes
    ref: friendly
    note: 位於遊客中心，不能外推至大潭濕地。
  familyToilet:
    status: unknown
  rainyDay:
    status: yes
    ref: center
    note: 僅指遊客中心內的資訊展示；戶外濕地仍受天候影響。
  accessibility:
    status: yes
    ref: friendly
    note: 遊客中心有無障礙設施，濕地全程通行條件需另問。
  notes: 本篇以遊客中心及大潭濕地兩處為範圍，中心地址與設施不代表整片潟湖；推車及親子廁間尚未確認。
