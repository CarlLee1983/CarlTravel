    /* A: quiet notebook, ruled reading column and generous margins. */
    body.variant-A{background:#f7f6f3;color:#33322f}.variant-A .site-header{max-width:1200px;margin:auto;border-color:#d8d3c9}.variant-A h1,.variant-A h2,.variant-A h3{font-family:"Songti TC","PMingLiU",serif;font-weight:600}.variant-A h1{font-size:clamp(2.7rem,6vw,5rem);letter-spacing:-.04em}.variant-A h2{font-size:clamp(1.55rem,3vw,2.1rem)}.variant-A .page-wrap{max-width:1120px;margin:auto;padding:58px 28px}.variant-A .intro{max-width:730px;padding-bottom:54px}.variant-A .intro .eyebrow{color:#6d4f32}.variant-A .intro .lede{max-width:600px}.variant-A .filter-form{padding:25px 0;border-top:1px solid #cfc9bd;border-bottom:1px solid #cfc9bd}.variant-A .spot-list{margin-top:28px}.variant-A .spot-card{display:grid;grid-template-columns:130px minmax(0,1fr) 185px;gap:22px;border-bottom:1px solid #cfc9bd;padding:28px 0;align-items:start}.variant-A .spot-card .index{font-family:"Songti TC",serif;font-size:2.4rem;color:#665b4a}.variant-A .spot-card h2{margin-bottom:8px}.variant-A .spot-card .card-tail{text-align:right;font-size:.84rem}.variant-A .spot-shell{display:grid;grid-template-columns:minmax(0,1fr) 205px;gap:72px}.variant-A .spot-article{max-width:720px}.variant-A .spot-hero{padding-bottom:45px}.variant-A .spot-hero .summary{font-family:"Songti TC",serif;font-size:1.4rem;line-height:1.7}.variant-A .section{padding:35px 0;border-top:1px solid #cfc9bd}.variant-A .side-note{position:sticky;top:30px;align-self:start;padding-top:14px;border-top:3px solid #ab8b66;font-size:.85rem}.variant-A .source-pill{margin-right:5px}

ck-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.variant-B .side-note{font-size:.84rem;border-top:3px solid #227c78;padding:12px 0;margin:0 0 14px}.variant-B .demo-map{background:#eef4f4}

riant-C .demo-map{background:#ecf1e5}
    @media(max-width:900px){.filter-form{grid-template-columns:repeat(2,minmax(0,1fr))}.filter-form label:first-child{grid-column:1/-1}.variant-A .spot-shell,.variant-C .spot-shell{grid-template-columns:1fr;gap:12px}.variant-A .side-note,.variant-C .local-nav{position:static}.variant-C .local-nav{display:flex;gap:14px;overflow:auto;white-space:nowrap}.variant-C .local-nav a{border:0}.variant-B .work-layout{grid-template-columns:1fr}.variant-B .tool-rail{position:static}.variant-B .filter-form{grid-template-columns:repeat(2,minmax(0,1fr))}.variant-B .filter-form label:first-child{grid-column:1/-1}.variant-B .spot-card{grid-template-columns:2fr 1fr}.variant-B .card-tail{text-align:left}.variant-B .check-grid,.variant-C .check-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:600px){.site-header{padding:17px 18px}.top-nav{gap:10px}.page-wrap,.variant-A .page-wrap,.variant-B .page-wrap,.variant-C .page-wrap{padding:30px 18px}.variant-A .intro{padding-bottom:30px}.variant-A .spot-card{grid-template-columns:40px minmax(0,1fr);gap:10px}.variant-A .spot-card .index{font-size:1.5rem}.variant-A .card-tail{grid-column:2;text-align:left}.variant-B .spot-article{grid-template-columns:1fr}.variant-B .spot-article .section.wide{grid-column:auto}.variant-B .spot-card{grid-template-columns:1fr 1fr}.variant-C .intro,.variant-C .spot-list{grid-template-columns:1fr}.check-grid,.variant-B .check-grid,.variant-C .check-grid{grid-template-columns:1fr}.fact-row{grid-template-columns:1fr;gap:3px}.filter-form,.variant-B .filter-form{grid-template-columns:1fr}.filter-form label:first-child,.variant-B .filter-form label:first-child{grid-column:auto}.prototype-bar{gap:3px;padding:5px}.prototype-bar .variant-name{min-width:90px;font-size:.66rem}.prototype-bar button{min-width:32px;min-height:34px;padding:4px 7px}.prototype-bar .page-link{font-size:.67rem}}

    body.variant-D{background:#e8ebeb;color:#213039}
    .variant-D h1,.variant-D h2,.variant-D h3{font-family:"Songti TC","PMingLiU",serif;font-weight:600}

<body>
  <a class="skip" href="#main">跳至主要內容</a>
  <div class="demo-ribbon">視覺方向原型 · 所有人物、景點、資料與網址皆為虛構示意 · 請勿作為旅遊資訊</div>
  <header class="site-header"><a class="brand" href="?variant=A&page=home" id="brand">CarlTravel <span class="small">/ prototype</span></a><nav class="top-nav" aria-label="主要導覽"><button type="button" data-page="home">探索景點</button><button type="button" data-page="spot">景點示例</button></nav></header>
  <main id="main"></main>
  <div class="prototype-bar" role="group" aria-label="原型切換"><button type="button" id="prev" aria-label="上一個視覺方案">←</button><span class="variant-name" id="variant-label" aria-live="polite"></span><button type="button" id="next" aria-label="下一個視覺方案">→</button><button type="button" class="page-link" data-page="home">首頁</button><button type="button" class="page-link" data-page="spot">景點</button></div>
  <script>
    // Three variants of the same fictitious home and spot pages, switched by ?variant= and ?page=.
    const spots = [
      {id:'shanlan',name:'山嵐木雕親子館',county:'苗栗縣',district:'三義鄉',kind:'博物館',setting:'室內',age:'4 歲以上',ageBands:['3–6 歲','7–12 歲','13 歲以上'],summary:'看木雕、摸木紋，再動手打磨一塊小木頭。',detail:true},
      {id:'river',name:'石灣河岸遊戲場',county:'新北市',district:'三峽區',kind:'公園',setting:'戶外',age:'0–2 歲、3–6 歲、7–12 歲',ageBands:['0–2 歲','3–6 歲','7–12 歲'],summary:'沿河散步與玩沙的午後去處，遮蔭區可暫歇。',detail:false},
      {id:'greenhouse',name:'南風玻璃溫室',county:'臺南市',district:'新化區',kind:'農場',setting:'室內外皆有',age:'年齡未標示',ageBands:['年齡未標示'],summary:'走進溫室辨認香草，戶外留一段草地時間。',detail:false}
    ];
    const names={A:'A · 旅行筆記',B:'B · 出遊工具',C:'C · 在地指南',D:'D · 混搭定案'};
    const sectionNames=['親子清單','開放時間與費用','交通與停車','設施','跟孩子一起看','原作者心得','Agent 建議','周邊安排','來源與官方出處','免責聲明'];
    const state={variant:'A',page:'home',q:'',county:'',kind:'',setting:'',age:''};
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const tag=s=>`<span class="tag">${esc(s)}</span>`;
    const pill=(type,text)=>`<span class="source-pill ${type}">${text}</span>`;
    const status=(type,text)=>`<span class="status ${type}">${text}</span>`;
    const ref=(id)=>`<span class="meta-line">〔官方出處 ${id} · 查證 2026-10-15〕</span>`;
    function url(){const p=new URLSearchParams(location.search);p.set('variant',state.variant);p.set('page',state.page);history.replaceState(null,'',location.pathname+'?'+p.toString());}
    function readUrl(){const p=new URLSearchParams(location.search);state.variant=['A','B','C','D'].includes(p.get('variant'))?p.get('variant'):'A';state.page=p.get('page')==='spot'?'spot':'home';}
    function navigate(page){state.page=page;url();render();scrollTo(0,0);}
    function variant(delta){let n=['A','B','C','D'].indexOf(state.variant);state.variant=['A','B','C','D'][(n+delta+4)%4];url();render();}
    function filterForm(){const options=(key,label,values)=>`<label>${label}<select name="${key}"><option value="">全部</option>${values.map(v=>`<option value="${esc(v)}" ${state[key]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`;
      const values=(key)=>{const found=[...new Set(spots.flatMap(s=>key==='age'?s.ageBands:[s[key]]))];return key==='age'?['0–2 歲','3–6 歲','7–12 歲','13 歲以上','年齡未標示'].filter(v=>found.includes(v)):found;};
      return `<form class="filter-form" id="filters" role="search"><label>搜尋景點<input type="search" name="q" value="${esc(state.q)}" placeholder="名稱、縣市或摘要" autocomplete="off"></label>${options('county','縣市',values('county'))}${options('kind','種類',values('kind'))}${options('setting','場域',values('setting'))}${options('age','年齡帶',values('age'))}<button type="reset">清除條件</button></form>`;
    }
    function filtered(){return spots.filter(s=>(!state.q||[s.name,s.county,s.district,s.summary].join(' ').toLowerCase().includes(state.q.trim().toLowerCase()))&&(!state.county||s.county===state.county)&&(!state.kind||s.kind===state.kind)&&(!state.setting||s.setting===state.setting)&&(!state.age||s.ageBands.includes(state.age))).sort((a,b)=>['新北市','苗栗縣','臺南市'].indexOf(a.county)-['新北市','苗栗縣','臺南市'].indexOf(b.county)||a.name.localeCompare(b.name,'zh-Hant'));}
    function action(s){return s.detail?'<button type="button" data-page="spot">閱讀景點示例 →</button>':'<span class="preview-note">僅供列表視覺比較 · 尚無詳細頁</span>';}
    function cardA(s,i){return `<article class="spot-card"><div class="index">${String(i+1).padStart(2,'0')}</div><div><div class="eyebrow">${esc(s.county)} / ${esc(s.district)}</div><h2>${esc(s.name)}</h2><p>${esc(s.summary)}</p><div>${tag(s.kind)}${tag(s.setting)}</div></div><div class="card-tail"><p>${esc(s.age)}</p>${action(s)}</div></article>`;}
    function cardB(s){return `<article class="spot-card"><div><h2>${esc(s.name)}</h2><p>${esc(s.summary)}</p></div><div><strong>${esc(s.county)} ${esc(s.district)}</strong><br>${esc(s.kind)}</div><div>${tag(s.setting)}<br><span class="small">${esc(s.age)}</span></div><div class="card-tail">${action(s)}</div></article>`;}
    function cardC(s){return `<article class="spot-card"><div class="eyebrow">${esc(s.district)} · ${esc(s.kind)}</div><h3>${esc(s.name)}</h3><p>${esc(s.summary)}</p><div class="card-tail">${esc(s.setting)} / ${esc(s.age)}<br>${action(s)}</div></article>`;}
    function results(){const list=filtered();const count=`<p class="result-count" role="status">找到 ${list.length} 個示意景點 · 依縣市由北到南排列</p>`;if(!list.length)return count+'<p class="empty">沒有符合條件的景點。可調整搜尋字詞或清除條件。</p>';
      if(state.variant==='C'){const groups=[...new Set(list.map(s=>s.county))];return count+`<div class="spot-list">${groups.map(c=>`<section class="county-group"><h2>${esc(c)} <span class="small">${list.filter(s=>s.county===c).length} 處</span></h2>${list.filter(s=>s.county===c).map(cardC).join('')}</section>`).join('')}</div>`;}
      return count+`<div class="spot-list">${list.map((s,i)=>state.variant==='A'?cardA(s,i):cardB(s)).join('')}</div>`;
    }
    function intro(){return `<div class="intro"><div><div class="eyebrow">台灣親子出遊 / 視覺原型</div><h1>${(state.variant==='B'||(state.variant==='D'&&state.page==='home'))?'找到適合今天的景點':state.variant==='C'?'從一座城市，走向一段小旅行':'把出門的好奇，記成一頁。'}</h1></div><div><p class="lede">CarlTravel 整理適合與孩子一起走訪的台灣景點。<strong>官方資訊</strong>、<strong>原作者心得</strong>與 <strong>Agent 建議</strong>分開標示；內容經 Carl 審閱後才會發布。</p><p class="small muted">以下三個景點、時間、價格與來源均為虛構，僅用來比較版面。此頁不是正式網站。</p></div></div>`;}
    function home(){if((state.variant==='B'||(state.variant==='D'&&state.page==='home')))return `<div class="page-wrap work-layout"><aside class="tool-rail"><div class="eyebrow">景點索引 · Demo</div><h1>出遊條件</h1><p class="lede">依縣市、種類、場域和年齡快速縮小範圍。</p>${filterForm()}</aside><div class="work-main"><div class="work-head"><div><div class="eyebrow">CarlTravel / 全部景點</div><h1>景點索引</h1></div><p class="small">官方資訊 · 原作者心得 · Agent 建議<br>每頁清楚分開</p></div><p class="lede">CarlTravel 整理台灣親子景點。內容經 Carl 審閱後才發布；三類資訊分開標示，方便出門前核對。</p><p class="small muted">虛構資料供視覺比較；只有山嵐木雕親子館有詳細頁。</p><div id="results">${results()}</div></div></div>`;
      return `<div class="page-wrap">${intro()}${filterForm()}<div id="results">${results()}</div></div>`;}
    function sec(i,body,wide=false){return `<section class="section ${wide?'wide':''}" id="section-${i+1}"><div class="section-head"><h2>${sectionNames[i]}</h2><span class="eyebrow">${String(i+1).padStart(2,'0')}</span></div>${body}</section>`;}
    function checklist(){const items=[['推車通行','good','有','全館設有坡道與電梯'],['哺乳室','good','有','位於一樓服務台旁'],['親子廁所','unknown','未知','官方未公布；未知不代表沒有'],['雨天備案','good','有','展區與體驗區都在室內'],['建議年齡','good','有','體驗區建議 4 歲以上'],['無障礙設施','good','有','無障礙廁所與停車位'],['兒童推車借用','no','無','示例設定：館方表示未提供借用']];return `<p>${pill('official','官方資訊')} <span class="meta-line">查證 2026-10-15</span></p><div class="check-grid">${items.map(([label,type,val,note])=>`<div class="check-item"><strong>${label}</strong>${status(type,val)}<p>${note}</p></div>`).join('')}</div>`;}
    function hours(){const oldRef=id=>`<span class="meta-line">〔官方出處 ${id} · 查證 2025-09-01〕</span>`;return `<p>${pill('official','官方資訊')} <span class="meta-line">查證 2025-09-01</span></p><dl class="fact-list"><div class="fact-row"><dt>開放時間</dt><dd>09:00–17:00，週一休館；國定假日照常開放 ${oldRef('A')}</dd></div><div class="fact-row"><dt>假日全票</dt><dd>${status('conflict','資料不一致')}<p>館方網頁 150 元；縣府旅遊頁 120 元。</p><p>出發前請致電示例服務台確認：037-000-000。</p>${oldRef('A、B')}</dd></div><div class="fact-row"><dt>免票對象</dt><dd>未滿 6 歲兒童、65 歲以上長者、身心障礙者及一名陪同者 ${oldRef('A')}</dd></div></dl><div class="notice">${status('outdated','資料可能過期')} 此原型的今天為 2026-10-15；本節示意資料於 2025-09-01 查證，出發前應重新確認時刻與票價。</div>`;}
    function transport(){return `<p>${pill('official','官方資訊')} <span class="meta-line">查證 2026-10-15</span></p><dl class="fact-list"><div class="fact-row"><dt>大眾運輸</dt><dd>臺鐵三義站轉乘示意公車至「廣聲新城」站，步行約 5 分鐘 ${ref('A')}</dd></div><div class="fact-row"><dt>停車</dt><dd>館前示意停車場約 40 格 ${ref('A')}</dd></div><div class="fact-row"><dt>停車費</dt><dd>${status('unpublished','官方未公布')} 出發前可先詢問館方。</dd></div></dl><div class="demo-map"><strong>地圖連結示意</strong><button type="button" disabled>Google Maps · 未啟用</button><button type="button" disabled>OpenStreetMap · 未啟用</button><span class="small">虛構地址，避免誤導至真實地點。</span></div>`;}
    function detailSections(){return [
      sec(0,checklist(),true),
      sec(1,hours()),
      sec(2,transport()),
      sec(3,`<p>${pill('official','官方資訊')} 一樓服務台旁有哺乳室；館內設坡道、電梯與無障礙廁所。 ${ref('A')}</p>`),
      sec(4,`<p>${pill('official','官方資訊')} 館內展示的樟木雕刻，是三義早期木雕產業常用材料。 ${ref('A')}</p><p>${pill('agent','Agent 建議')} 和孩子找三種不同動物木雕，比較木紋方向。</p>`),
      sec(5,`<p>${pill('author','原作者心得')} 「小樹媽媽的週末」記錄一個雨天週六：體驗須先登記梯次，上午容易額滿。她的五歲孩子最喜歡打磨小木塊，約玩了四十分鐘。</p><p class="meta-line">依示例來源 C 轉述 · 讀取 2026-10-15。個人經驗不代表每次到訪情況。</p>`),
      sec(6,`<p>${pill('agent','Agent 建議')} 假日可先到服務台登記體驗梯次，再參觀展區。停車費尚未公布，自行開車前可先電話確認。</p>`),
      sec(7,`<p>${pill('author','原作者心得')} 廣聲新城老街：示意步行約 10 分鐘，可順道散步。這是周邊安排，並非獨立景點。<span class="meta-line">〔來源 C〕</span></p>`),
      sec(8,`<h3>官方出處</h3><ul><li><strong>A</strong> 山嵐木雕親子館參觀資訊 — 示意：example.com/shanlan/visit</li><li><strong>B</strong> 苗栗文化觀光旅遊網景點頁 — 示意：example.com/miaoli-travel/spot/1234</li></ul><h3>來源</h3><ul><li><strong>C</strong> 小樹媽媽的週末〈三義雨天好去處〉— 示意：example.com/blog-a/shanlan，讀取 2026-10-15</li><li><strong>D</strong> 爸爸帶路〈苗栗親子景點懶人包〉— ${status('unreadable','原文無法讀取')} 示意：example.com/blog-b/miaoli；未採用其內容</li></ul><p class="small">所有網址只以文字展示，均屬虛構範例。</p>`,true),
      sec(9,`<p>實際資訊以官方公告為準，出發前請再確認。「查證日期」只表示當日所見；親子設施資訊僅供參考，未知不代表沒有。原作者心得只代表作者本人。<a href="#about-note">關於這份示意與完整免責說明</a></p><p id="about-note" class="small">本原型沒有正式關於頁；此處示範日後會連至 /about/。內容與景點均為虛構。</p>`,true)
    ].join('');}
    function spotHero(){return `<header class="spot-hero"><div class="eyebrow">苗栗縣 / 三義鄉 · 景點示例</div><h1>山嵐木雕親子館</h1><p class="summary">看木雕、摸木紋，再動手打磨一塊小木頭。</p><div>${tag('博物館')}${tag('室內')}${tag('4 歲以上')}</div><p class="small muted">虛構景點與地址：苗栗縣三義鄉廣聲新城 88 號 · 此頁只供比較版面。</p></header>`;}
    function sourceLegend(){return `<div class="side-note"><strong>閱讀標記</strong><p>${pill('official','官方資訊')} 依官方出處整理</p><p>${pill('author','原作者心得')} 作者個人經驗</p><p>${pill('agent','Agent 建議')} 整理後的建議</p><p class="small">查證日期標示每節資料查看日期。</p></div>`;}
    function spot(){if((state.variant==='B'||(state.variant==='D'&&state.page==='home')))return `<div class="page-wrap"><div class="work-head"><div><div class="eyebrow">景點資料 / 虛構示例</div><h1>出遊資訊一覽</h1></div><button type="button" data-page="home">← 返回索引</button></div>${spotHero()}${sourceLegend()}<article class="spot-article">${detailSections()}</article></div>`;
      if((state.variant==='C'||state.variant==='D'))return `<div class="page-wrap spot-shell"><nav class="local-nav" aria-label="景點頁段落"><div class="eyebrow">本頁目錄</div>${sectionNames.map((n,i)=>`<a href="#section-${i+1}">${String(i+1).padStart(2,'0')} ${n}</a>`).join('')}</nav><article class="spot-article">${spotHero()}${sourceLegend()}${detailSections()}</article></div>`;
      return `<div class="page-wrap spot-shell"><article class="spot-article">${spotHero()}${detailSections()}</article>${sourceLegend()}</div>`;}
    function render(){document.body.className=state.variant==='D'?'variant-D variant-'+(state.page==='home'?'B':'C'):'variant-'+state.variant;document.getElementById('main').innerHTML=state.page==='home'?home():spot();document.getElementById('variant-label').textContent=names[state.variant];document.title=`${state.page==='home'?'首頁':'景點'} · ${names[state.variant]} · CarlTravel 原型`;document.querySelectorAll('[data-page]').forEach(b=>{if(b.tagName==='BUTTON'){b.setAttribute('aria-current',b.dataset.page===state.page?'page':'false');}});document.getElementById('brand').href=`?variant=${state.variant}&page=home`;}
    document.addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)navigate(b.dataset.page);});
    document.getElementById('prev').addEventListener('click',()=>variant(-1));document.getElementById('next').addEventListener('click',()=>variant(1));
    document.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key)||e.altKey||e.ctrlKey||e.metaKey)return;const target=e.target;if(target.closest('input,textarea,select,[contenteditable]'))return;e.preventDefault();variant(e.key==='ArrowRight'?1:-1);});
    document.addEventListener('input',e=>{if(e.target.form?.id!=='filters')return;state[e.target.name]=e.target.value;document.getElementById('results').innerHTML=results();});
    document.addEventListener('change',e=>{if(e.target.form?.id!=='filters')return;state[e.target.name]=e.target.value;document.getElementById('results').innerHTML=results();});
    document.addEventListener('reset',e=>{if(e.target.id!=='filters')return;['q','county','kind','setting','age'].forEach(k=>state[k]='');setTimeout(()=>{document.getElementById('results').innerHTML=results();},0);});
    readUrl();render();
  </script>
</body>
</html>
